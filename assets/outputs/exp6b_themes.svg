<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="100%">
  <defs>
    <linearGradient id="exp6bBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="exp6bHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <filter id="exp6bShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Browser Frame in Dark Theme -->
  <rect x="20" y="15" width="810" height="490" rx="10" fill="url(#exp6bBgGrad)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Browser Chrome Header -->
  <path d="M 20 25 Q 20 15 30 15 L 820 15 Q 830 15 830 25 L 830 52 L 20 52 Z" fill="#1e293b" />
  <circle cx="44" cy="34" r="6" fill="#ef4444" />
  <circle cx="64" cy="34" r="6" fill="#f59e0b" />
  <circle cx="84" cy="34" r="6" fill="#10b981" />
  
  <!-- URL Bar -->
  <rect x="180" y="24" width="480" height="22" rx="11" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="420" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">
    🔒 http://localhost:8080/#/exp6b-themes-styling
  </text>

  <!-- Flutter App Bar -->
  <rect x="20" y="52" width="810" height="46" fill="url(#exp6bHeaderGrad)" />
  <text x="50" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#ffffff">
    Exp 6(b): Material 3 Theming System (Light / Dark Mode Switcher)
  </text>

  <!-- Theme Toggle Switch in App Bar -->
  <rect x="710" y="62" width="46" height="24" rx="12" fill="#7e22ce" />
  <circle cx="743" cy="74" r="9" fill="#ffffff" />
  <text x="685" y="78" font-size="14">🌙</text>

  <!-- Active Theme Card -->
  <g filter="url(#exp6bShadow)">
    <rect x="65" y="118" width="720" height="85" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="90" y="148" font-family="-apple-system, sans-serif" font-size="18" font-weight="bold" fill="#c084fc">
      🌙 Material 3 Dark Theme Active
    </text>
    <text x="90" y="172" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">
      ThemeData configured with colorSchemeSeed: Colors.deepPurple • Dynamic surface elevation active.
    </text>
  </g>

  <!-- ColorScheme Swatches Card -->
  <g filter="url(#exp6bShadow)">
    <rect x="65" y="222" width="720" height="120" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="90" y="250" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">
      Active ColorScheme Dynamic Tokens:
    </text>

    <!-- Swatch 1: Primary -->
    <rect x="90" y="265" width="200" height="55" rx="8" fill="#a855f7"/>
    <text x="190" y="288" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Primary</text>
    <text x="190" y="306" font-family="Consolas, monospace" font-size="10" fill="#f3e8ff" text-anchor="middle">#A855F7</text>

    <!-- Swatch 2: Secondary -->
    <rect x="325" y="265" width="200" height="55" rx="8" fill="#38bdf8"/>
    <text x="425" y="288" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Secondary</text>
    <text x="425" y="306" font-family="Consolas, monospace" font-size="10" fill="#0f172a" text-anchor="middle">#38BDF8</text>

    <!-- Swatch 3: Surface -->
    <rect x="560" y="265" width="200" height="55" rx="8" fill="#334155" stroke="#475569" stroke-width="1"/>
    <text x="660" y="288" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">Surface Variant</text>
    <text x="660" y="306" font-family="Consolas, monospace" font-size="10" fill="#94a3b8" text-anchor="middle">#334155</text>
  </g>

  <!-- Interactive Themed Buttons Card -->
  <g filter="url(#exp6bShadow)">
    <rect x="65" y="360" width="720" height="120" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="90" y="390" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">
      Themed Material Component Styles:
    </text>

    <!-- Elevated Themed Button -->
    <rect x="90" y="410" width="200" height="42" rx="10" fill="#a855f7"/>
    <text x="190" y="436" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Elevated Button</text>

    <!-- Outlined Button -->
    <rect x="325" y="410" width="200" height="42" rx="10" fill="transparent" stroke="#c084fc" stroke-width="1.5"/>
    <text x="425" y="436" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#c084fc" text-anchor="middle">Outlined Button</text>

    <!-- Tonal Button -->
    <rect x="560" y="410" width="200" height="42" rx="10" fill="#581c87"/>
    <text x="660" y="436" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#e9d5ff" text-anchor="middle">Tonal Filled Button</text>
  </g>
</svg>
