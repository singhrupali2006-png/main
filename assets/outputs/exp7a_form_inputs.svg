<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 540" width="100%" height="100%">
  <defs>
    <linearGradient id="exp7aHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <filter id="exp7aShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Browser Frame -->
  <rect x="20" y="15" width="810" height="510" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  
  <!-- Browser Chrome Header -->
  <path d="M 20 25 Q 20 15 30 15 L 820 15 Q 830 15 830 25 L 830 52 L 20 52 Z" fill="#e2e8f0" />
  <circle cx="44" cy="34" r="6" fill="#ef4444" />
  <circle cx="64" cy="34" r="6" fill="#f59e0b" />
  <circle cx="84" cy="34" r="6" fill="#10b981" />
  
  <!-- URL Bar -->
  <rect x="180" y="24" width="480" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="420" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569" text-anchor="middle">
    🔒 http://localhost:8080/#/exp7a-form-inputs
  </text>

  <!-- Flutter App Bar -->
  <rect x="20" y="52" width="810" height="46" fill="url(#exp7aHeaderGrad)" />
  <text x="50" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#ffffff">
    Exp 7(a): Comprehensive Interactive Form Controls &amp; Input Fields
  </text>

  <!-- Form Canvas Container Card -->
  <g filter="url(#exp7aShadow)">
    <rect x="125" y="115" width="600" height="390" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Form Title -->
    <text x="155" y="142" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">
      Developer Profile Registration
    </text>
    <text x="155" y="158" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">
      Text inputs, Dropdowns, Sliders, Switches, Radios &amp; Checkboxes
    </text>
    <line x1="155" y1="168" x2="695" y2="168" stroke="#f1f5f9" stroke-width="1.5"/>

    <!-- Field 1: Full Name -->
    <rect x="155" y="180" width="260" height="36" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
    <text x="170" y="203" font-family="-apple-system, sans-serif" font-size="12" fill="#0f172a">👤 Rupali Singh</text>

    <!-- Field 2: Email -->
    <rect x="435" y="180" width="260" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="450" y="203" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b">✉️ rupali@example.com</text>

    <!-- Field 3: Technical Role Dropdown -->
    <rect x="155" y="228" width="540" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="170" y="251" font-family="-apple-system, sans-serif" font-size="12" fill="#0f172a">💼 Role: Mobile Engineer (Flutter)</text>
    <text x="675" y="251" font-size="11" fill="#64748b">▼</text>

    <!-- Field 4: Slider Input -->
    <text x="155" y="285" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155">
      Years of Experience: 4 years
    </text>
    <line x1="155" y1="300" x2="695" y2="300" stroke="#ccfbf1" stroke-width="6" stroke-linecap="round"/>
    <line x1="155" y1="300" x2="350" y2="300" stroke="#0d9488" stroke-width="6" stroke-linecap="round"/>
    <circle cx="350" cy="300" r="9" fill="#0f766e" stroke="#ffffff" stroke-width="2"/>

    <!-- Field 5 & 6: Switch & Radios -->
    <!-- Switch -->
    <rect x="155" y="325" width="250" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="170" y="347" font-family="-apple-system, sans-serif" font-size="11" fill="#334155">Email Notifications</text>
    <rect x="365" y="334" width="30" height="16" rx="8" fill="#0d9488"/>
    <circle cx="388" cy="342" r="6" fill="#ffffff"/>

    <!-- Radio -->
    <rect x="420" y="325" width="275" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="440" cy="343" r="6" fill="#0d9488" stroke="#0d9488" stroke-width="2"/>
    <circle cx="440" cy="343" r="3" fill="#ffffff"/>
    <text x="455" y="347" font-family="-apple-system, sans-serif" font-size="11" fill="#334155">Full-Time</text>
    
    <circle cx="560" cy="343" r="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="575" y="347" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">Contract</text>

    <!-- Field 7: Checkbox Terms -->
    <rect x="155" y="375" width="16" height="16" rx="3" fill="#0d9488"/>
    <path d="M 158 383 L 162 387 L 168 379" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text x="180" y="388" font-family="-apple-system, sans-serif" font-size="11" fill="#475569">
      I accept terms of service and software development policy
    </text>

    <!-- Submit Button -->
    <rect x="155" y="415" width="540" height="42" rx="8" fill="#115e59"/>
    <text x="425" y="441" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
      ➔ Register Developer Profile
    </text>
  </g>
</svg>
