    <text x="50" y="115" fill="#f43f5e">abstract class </text><text x="145" y="115" fill="#38bdf8">Person</text><text x="185" y="115"> {</text>
    <text x="65" y="132" fill="#94a3b8">  final String name;</text>
    <text x="65" y="149" fill="#94a3b8">  final int age;</text>
    <text x="65" y="166" fill="#38bdf8">  Person</text><text x="105" y="166">({required this.name, ...});</text>
    <text x="50" y="183">}</text>

    <text x="50" y="205" fill="#f43f5e">class </text><text x="90" y="205" fill="#38bdf8">Student </text><text x="140" y="205" fill="#f43f5e">extends </text><text x="190" y="205" fill="#38bdf8">Person </text>
    <text x="65" y="222" fill="#f43f5e">with </text><text x="95" y="222" fill="#38bdf8">LoggerMixin </text><text x="175" y="222">{</text>
    <text x="65" y="239" fill="#94a3b8">  final String studentId;</text>
    <text x="65" y="256" fill="#94a3b8">  double _gpa;</text>
    <text x="65" y="273" fill="#a855f7">  double get </text><text x="135" y="273">gpa =&gt; _gpa;</text>
    <text x="65" y="290" fill="#a855f7">  set </text><text x="90" y="290">gpa(double v) { ... }</text>
    <text x="50" y="307">}</text>

    <text x="50" y="330" fill="#f43f5e">void </text><text x="80" y="330" fill="#38bdf8">main</text><text x="105" y="330">() async {</text>
    <text x="65" y="347" fill="#94a3b8">  final s = Student(name: 'Rupali');</text>
    <text x="65" y="364" fill="#94a3b8">  s.displayProfile();</text>
    <text x="65" y="381" fill="#94a3b8">  await fetchMockUserData(s.id);</text>
    <text x="50" y="398">}</text>
  </g>

