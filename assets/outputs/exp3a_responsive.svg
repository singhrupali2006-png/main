<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="100%">
  <defs>
    <linearGradient id="exp3aHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7e22ce" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>
    <filter id="exp3aShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Browser Frame -->
  <rect x="20" y="15" width="810" height="490" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  
  <!-- Browser Chrome Header -->
  <path d="M 20 25 Q 20 15 30 15 L 820 15 Q 830 15 830 25 L 830 52 L 20 52 Z" fill="#e2e8f0" />
  <circle cx="44" cy="34" r="6" fill="#ef4444" />
  <circle cx="64" cy="34" r="6" fill="#f59e0b" />
  <circle cx="84" cy="34" r="6" fill="#10b981" />
  
  <!-- URL Bar -->
  <rect x="180" y="24" width="480" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="420" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569" text-anchor="middle">
    🔒 http://localhost:8080/#/exp3a-responsive-ui
  </text>

  <!-- Flutter App Bar -->
  <rect x="20" y="52" width="810" height="46" fill="url(#exp3aHeaderGrad)" />
  <text x="50" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#ffffff">
    Exp 3(a): Responsive Multi-Device UI (LayoutBuilder Adaptation)
  </text>

  <!-- Dynamic Status Alert -->
  <rect x="50" y="112" width="750" height="36" rx="8" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1"/>
  <circle cx="70" cy="130" r="8" fill="#a855f7" />
  <text x="70" y="134" font-family="sans-serif" font-size="10" fill="#ffffff" font-weight="bold" text-anchor="middle">⚡</text>
  <text x="90" y="135" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#6b21a8">
    Active Mode: Desktop Web Viewport (1080px) • LayoutBuilder computed 3-Column Adaptive Grid
  </text>

  <!-- Desktop View 3-Column Grid Cards -->
  <!-- Row 1 Card 1 -->
  <g filter="url(#exp3aShadow)">
    <rect x="50" y="165" width="235" height="135" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="68" y="195" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#64748b">Active Users</text>
    <circle cx="255" cy="190" r="14" fill="#dbeafe" />
    <text x="255" y="195" font-size="11" text-anchor="middle">👥</text>
    <text x="68" y="240" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="bold" fill="#1e3a8a">14,290</text>
    <text x="68" y="270" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#16a34a" font-weight="500">▲ +12.5% from last week</text>
  </g>

  <!-- Row 1 Card 2 -->
  <g filter="url(#exp3aShadow)">
    <rect x="305" y="165" width="235" height="135" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="323" y="195" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#64748b">Monthly Revenue</text>
    <circle cx="510" cy="190" r="14" fill="#dcfce7" />
    <text x="510" y="195" font-size="11" text-anchor="middle">📈</text>
    <text x="323" y="240" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="bold" fill="#14532d">$48,900</text>
    <text x="323" y="270" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#16a34a" font-weight="500">▲ +18.2% vs target</text>
  </g>

  <!-- Row 1 Card 3 -->
  <g filter="url(#exp3aShadow)">
    <rect x="560" y="165" width="240" height="135" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="578" y="195" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#64748b">Server Uptime</text>
    <circle cx="765" cy="190" r="14" fill="#f3e8ff" />
    <text x="765" y="195" font-size="11" text-anchor="middle">☁️</text>
    <text x="578" y="240" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="bold" fill="#581c87">99.98%</text>
    <text x="578" y="270" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#16a34a" font-weight="500">● Operational • SLA Met</text>
  </g>

  <!-- Mobile View Mockup Preview (Overlaying at bottom) -->
  <rect x="50" y="320" width="750" height="165" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#exp3aShadow)"/>
  <text x="70" y="348" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">
    Mobile Viewport Comparison (Width &lt; 600px - Automatically collapses to 1-Column List):
  </text>
  
  <rect x="70" y="365" width="340" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="85" y="395" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Active Users: 14,290</text>
  <text x="360" y="395" font-size="12" fill="#16a34a" font-weight="bold">+12.5%</text>

  <rect x="70" y="425" width="340" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="85" y="455" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Monthly Revenue: $48,900</text>
  <text x="360" y="455" font-size="12" fill="#16a34a" font-weight="bold">+18.2%</text>

  <rect x="440" y="365" width="340" height="110" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="460" y="395" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#6b21a8">Responsive Logic Summary:</text>
  <text x="460" y="420" font-family="Consolas, monospace" font-size="11" fill="#4a044e">• Width &gt;= 950px : 3 Columns (crossAxisCount = 3)</text>
  <text x="460" y="440" font-family="Consolas, monospace" font-size="11" fill="#4a044e">• Width &gt;= 600px : 2 Columns (crossAxisCount = 2)</text>
  <text x="460" y="460" font-family="Consolas, monospace" font-size="11" fill="#4a044e">• Width &lt; 600px  : 1 Column Stack (crossAxisCount = 1)</text>
</svg>
