<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="100%">
  <defs>
    <linearGradient id="exp5bHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <filter id="exp5bShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Browser Frame -->
  <rect x="20" y="15" width="810" height="490" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  
  <!-- Browser Chrome Header -->
  <path d="M 20 25 Q 20 15 30 15 L 820 15 Q 830 15 830 25 L 830 52 L 20 52 Z" fill="#e2e8f0" />
  <circle cx="44" cy="34" r="6" fill="#ef4444" />
  <circle cx="64" cy="34" r="6" fill="#f59e0b" />
  <circle cx="84" cy="34" r="6" fill="#10b981" />
  
  <!-- URL Bar -->
  <rect x="180" y="24" width="480" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="420" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569" text-anchor="middle">
    🔒 http://localhost:8080/#/exp5b-provider-state
  </text>

  <!-- Flutter App Bar -->
  <rect x="20" y="52" width="810" height="46" fill="url(#exp5bHeaderGrad)" />
  <text x="50" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#ffffff">
    Exp 5(b): Reactive State Management (setState vs Provider Pattern)
  </text>

  <!-- Consumer Cart Badge in App Bar -->
  <rect x="660" y="61" width="150" height="28" rx="14" fill="#0d9488" />
  <circle cx="678" cy="75" r="7" fill="#14b8a6" />
  <text x="678" y="79" font-size="10" fill="#ffffff" text-anchor="middle">🛒</text>
  <text x="738" y="79" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">
    2 Items ($48.50)
  </text>

  <!-- Split Comparison Cards -->
  <!-- Pane 1: Ephemeral setState -->
  <g filter="url(#exp5bShadow)">
    <rect x="50" y="115" width="360" height="150" rx="12" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
    <circle cx="75" cy="140" r="12" fill="#ffedd5" />
    <text x="75" y="145" font-size="12" text-anchor="middle">⚡</text>
    <text x="96" y="145" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#c2410c">
      Local Ephemeral State (setState)
    </text>
    <text x="75" y="172" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">
      Scope: Isolated to single widget. No global broadcast.
    </text>
    <text x="75" y="200" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">
      Local Tap Counter: 5
    </text>
    <rect x="75" y="215" width="150" height="32" rx="6" fill="#ea580c"/>
    <text x="150" y="235" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">+ Increment Tap</text>
  </g>

  <!-- Pane 2: Global Provider Model -->
  <g filter="url(#exp5bShadow)">
    <rect x="440" y="115" width="360" height="150" rx="12" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
    <circle cx="465" cy="140" r="12" fill="#ccfbf1" />
    <text x="465" y="145" font-size="12" text-anchor="middle">🌐</text>
    <text x="486" y="145" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#0f766e">
      Global App State (Provider &amp; ChangeNotifier)
    </text>
    <text x="465" y="172" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">
      Scope: Shared app-wide. Rebuilds only registered Consumers.
    </text>
    <text x="465" y="200" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">
      Cart Total: $48.50 (2 products)
    </text>
    <rect x="465" y="215" width="130" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="530" y="235" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle">Clear Cart</text>
  </g>

  <!-- Catalog Section -->
  <text x="50" y="295" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">
    Product Catalog (Consumer Dispatches context.read&lt;CartNotifier&gt;().addItem):
  </text>

  <!-- Product Card 1 -->
  <g filter="url(#exp5bShadow)">
    <rect x="50" y="310" width="750" height="50" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="80" cy="335" r="14" fill="#eff6ff" />
    <text x="80" y="340" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">1</text>
    <text x="110" y="340" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Flutter Web Blueprint</text>
    <text x="320" y="340" font-family="Consolas, monospace" font-size="13" fill="#0f766e" font-weight="bold">$29.00</text>
    <rect x="690" y="320" width="90" height="30" rx="6" fill="#0284c7"/>
    <text x="735" y="339" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">+ Add Cart</text>
  </g>

  <!-- Product Card 2 -->
  <g filter="url(#exp5bShadow)">
    <rect x="50" y="370" width="750" height="50" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="80" cy="395" r="14" fill="#eff6ff" />
    <text x="80" y="400" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">2</text>
    <text x="110" y="400" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Dart Metaprogramming Guide</text>
    <text x="320" y="400" font-family="Consolas, monospace" font-size="13" fill="#0f766e" font-weight="bold">$19.50</text>
    <rect x="690" y="380" width="90" height="30" rx="6" fill="#0284c7"/>
    <text x="735" y="399" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">+ Add Cart</text>
  </g>

  <!-- Product Card 3 -->
  <g filter="url(#exp5bShadow)">
    <rect x="50" y="430" width="750" height="50" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="80" cy="455" r="14" fill="#eff6ff" />
    <text x="80" y="460" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">3</text>
    <text x="110" y="460" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Provider State Architecture</text>
    <text x="320" y="460" font-family="Consolas, monospace" font-size="13" fill="#0f766e" font-weight="bold">$24.00</text>
    <rect x="690" y="440" width="90" height="30" rx="6" fill="#0284c7"/>
    <text x="735" y="459" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">+ Add Cart</text>
  </g>
</svg>
