<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="100%">
  <defs>
    <linearGradient id="exp6aHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
    <linearGradient id="btnGradOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5722" />
      <stop offset="100%" stop-color="#e64a19" />
    </linearGradient>
    <linearGradient id="btnGradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="exp6aShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Browser Frame -->
  <rect x="20" y="15" width="810" height="490" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  
  <!-- Browser Chrome Header -->
  <path d="M 20 25 Q 20 15 30 15 L 820 15 Q 830 15 830 25 L 830 52 L 20 52 Z" fill="#e2e8f0" />
  <circle cx="44" cy="34" r="6" fill="#ef4444" />
  <circle cx="64" cy="34" r="6" fill="#f59e0b" />
  <circle cx="84" cy="34" r="6" fill="#10b981" />
  
  <!-- URL Bar -->
  <rect x="180" y="24" width="480" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="420" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569" text-anchor="middle">
    🔒 http://localhost:8080/#/exp6a-custom-widgets
  </text>

  <!-- Flutter App Bar -->
  <rect x="20" y="52" width="810" height="46" fill="url(#exp6aHeaderGrad)" />
  <text x="50" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#ffffff">
    Exp 6(a): Reusable Modular Custom Widgets (Avatar, Metric Cards, Gradient Buttons)
  </text>

  <!-- Section 1: Custom Avatar Badge Card -->
  <g filter="url(#exp6aShadow)">
    <rect x="50" y="115" width="750" height="85" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- CustomAvatarBadge -->
    <circle cx="95" cy="157" r="28" fill="#ffedd5" stroke="#fed7aa" stroke-width="1.5"/>
    <text x="95" y="165" font-family="-apple-system, sans-serif" font-size="18" font-weight="bold" fill="#ea580c" text-anchor="middle">RS</text>
    <!-- Status Dot -->
    <circle cx="116" cy="176" r="8" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>

    <text x="145" y="148" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">
      Rupali Singh (Lead Mobile Engineer)
    </text>
    <text x="145" y="170" font-family="-apple-system, sans-serif" font-size="12" fill="#16a34a" font-weight="600">
      ● Active Now • Rendered via CustomAvatarBadge widget with presence dot
    </text>
  </g>

  <!-- Section 2: Custom Metric Cards -->
  <!-- Metric Card 1 -->
  <g filter="url(#exp6aShadow)">
    <rect x="50" y="218" width="360" height="130" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="75" y="248" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#64748b">Total Traffic</text>
    <circle cx="370" cy="244" r="16" fill="#e0e7ff" />
    <text x="370" y="249" font-size="13" text-anchor="middle">🌐</text>
    
    <text x="75" y="295" font-family="-apple-system, sans-serif" font-size="28" font-weight="bold" fill="#1e293b">2.4M</text>
    <text x="75" y="325" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#16a34a">▲ +14.2% vs previous period</text>
  </g>

  <!-- Metric Card 2 -->
  <g filter="url(#exp6aShadow)">
    <rect x="440" y="218" width="360" height="130" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="465" y="248" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#64748b">Bounce Rate</text>
    <circle cx="760" cy="244" r="16" fill="#ffedd5" />
    <text x="760" y="249" font-size="13" text-anchor="middle">📉</text>
    
    <text x="465" y="295" font-family="-apple-system, sans-serif" font-size="28" font-weight="bold" fill="#1e293b">24.8%</text>
    <text x="465" y="325" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#16a34a">▼ -3.1% (improvement)</text>
  </g>

  <!-- Section 3: Custom Gradient Buttons -->
  <g filter="url(#exp6aShadow)">
    <rect x="50" y="368" width="750" height="115" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="75" y="398" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">
      CustomGradientButton Components (with Ripple &amp; Shadow Elevation):
    </text>
    
    <!-- Button 1 -->
    <rect x="75" y="415" width="335" height="45" rx="10" fill="url(#btnGradOrange)"/>
    <text x="242" y="443" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
      ✓ Generate Report
    </text>

    <!-- Button 2 -->
    <rect x="440" y="415" width="335" height="45" rx="10" fill="url(#btnGradBlue)"/>
    <text x="607" y="443" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
      🚀 Deploy Pipeline
    </text>
  </g>
</svg>
