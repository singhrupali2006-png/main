<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="100%">
  <defs>
    <linearGradient id="exp5aHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <filter id="exp5aShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Browser Frame -->
  <rect x="20" y="15" width="810" height="490" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  
  <!-- Browser Chrome Header -->
  <path d="M 20 25 Q 20 15 30 15 L 820 15 Q 830 15 830 25 L 830 52 L 20 52 Z" fill="#e2e8f0" />
  <circle cx="44" cy="34" r="6" fill="#ef4444" />
  <circle cx="64" cy="34" r="6" fill="#f59e0b" />
  <circle cx="84" cy="34" r="6" fill="#10b981" />
  
  <!-- URL Bar -->
  <rect x="180" y="24" width="480" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="420" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569" text-anchor="middle">
    🔒 http://localhost:8080/#/exp5a-stateful-stateless
  </text>

  <!-- Flutter App Bar -->
  <rect x="20" y="52" width="810" height="46" fill="url(#exp5aHeaderGrad)" />
  <text x="50" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#ffffff">
    Exp 5(a): StatelessWidget &amp; StatefulWidget (Dynamic Counter &amp; UI Rebuilds)
  </text>

  <!-- Card 1: Stateless Info Banner -->
  <g filter="url(#exp5aShadow)">
    <rect x="100" y="115" width="650" height="85" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
    <circle cx="140" cy="157" r="18" fill="#c7d2fe" />
    <text x="140" y="163" font-size="16" text-anchor="middle">🔒</text>
    <text x="175" y="146" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" fill="#312e81">
      Stateless Widget Component (Immutable Configuration)
    </text>
    <text x="175" y="168" font-family="-apple-system, sans-serif" font-size="12" fill="#4338ca">
      Contains no internal mutable state. Built statically from parent arguments.
    </text>
  </g>

  <!-- Card 2: Interactive StatefulWidget Dashboard -->
  <g filter="url(#exp5aShadow)">
    <rect x="100" y="220" width="650" height="260" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Header of Stateful Card -->
    <text x="130" y="250" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" fill="#0f172a">
      Stateful Widget Component (Dynamic State via setState)
    </text>
    
    <!-- Rebuild Telemetry Pill -->
    <rect x="610" y="235" width="115" height="24" rx="12" fill="#fef3c7" />
    <text x="667" y="251" font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#92400e" text-anchor="middle">Rebuilds: 7</text>

    <!-- Value Display Box -->
    <rect x="130" y="275" width="590" height="90" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="425" y="302" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#15803d" letter-spacing="1.5" text-anchor="middle">
      CURRENT VALUE
    </text>
    <text x="425" y="348" font-family="-apple-system, sans-serif" font-size="44" font-weight="bold" fill="#166534" text-anchor="middle">
      35
    </text>

    <!-- Interactive Buttons -->
    <!-- Decrement Button -->
    <rect x="180" y="395" width="120" height="42" rx="8" fill="#dc2626"/>
    <text x="240" y="421" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">− 5 (Dec)</text>

    <!-- Reset Button -->
    <rect x="360" y="395" width="130" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="425" y="421" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">↺ Reset</text>

    <!-- Increment Button -->
    <rect x="550" y="395" width="120" height="42" rx="8" fill="#16a34a"/>
    <text x="610" y="421" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">+ 5 (Inc)</text>
    
    <!-- State notice footer -->
    <text x="425" y="462" font-family="Consolas, monospace" font-size="10" fill="#64748b" text-anchor="middle">
      setState() dispatched on click ➔ Widget Element invalidated &amp; rebuild scheduled
    </text>
  </g>
</svg>
