<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="100%">
  <defs>
    <linearGradient id="exp4aHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="exp4aShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Browser Frame -->
  <rect x="20" y="15" width="810" height="490" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  
  <!-- Browser Chrome Header -->
  <path d="M 20 25 Q 20 15 30 15 L 820 15 Q 830 15 830 25 L 830 52 L 20 52 Z" fill="#e2e8f0" />
  <circle cx="44" cy="34" r="6" fill="#ef4444" />
  <circle cx="64" cy="34" r="6" fill="#f59e0b" />
  <circle cx="84" cy="34" r="6" fill="#10b981" />
  
  <!-- URL Bar -->
  <rect x="180" y="24" width="480" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="420" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569" text-anchor="middle">
    🔒 http://localhost:8080/#/exp4a-navigator
  </text>

  <!-- Flutter App Bar -->
  <rect x="20" y="52" width="810" height="46" fill="url(#exp4aHeaderGrad)" />
  <text x="50" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#ffffff">
    Exp 4(a): Navigator Stack Flow (Push, Data Forwarding &amp; Pop Return)
  </text>

  <!-- Screen 1: Primary Screen (Left Box) -->
  <g filter="url(#exp4aShadow)">
    <rect x="50" y="125" width="330" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="50" y="125" width="330" height="38" rx="12" fill="#334155"/>
    <text x="70" y="150" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Screen A: Primary Catalog</text>

    <circle cx="215" cy="205" r="28" fill="#f1f5f9"/>
    <text x="215" y="213" font-size="22" text-anchor="middle">📦</text>

    <text x="215" y="255" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Item: Cloud Engine</text>
    <text x="215" y="275" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">ID: ITEM-9042 • Price: $49.99</text>

    <!-- Push Button -->
    <rect x="80" y="300" width="270" height="38" rx="8" fill="#1e293b"/>
    <text x="215" y="324" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Navigator.push(DetailScreen) ➔</text>

    <!-- SnackBar Output Box -->
    <rect x="65" y="358" width="300" height="48" rx="8" fill="#0f766e"/>
    <text x="80" y="380" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">✓ Result Popped to Screen A:</text>
    <text x="80" y="396" font-family="-apple-system, sans-serif" font-size="11" fill="#ccfbf1">"Confirmed Purchase of ITEM-9042"</text>
  </g>

  <!-- Interactive Data Flow Arrows (Center) -->
  <g>
    <!-- Push Arrow -->
    <path d="M 395 210 L 445 210" stroke="#0284c7" stroke-width="3" stroke-dasharray="4,4"/>
    <polygon points="445,205 455,210 445,215" fill="#0284c7" />
    <text x="425" y="195" font-family="Consolas, monospace" font-size="10" font-weight="bold" fill="#0284c7" text-anchor="middle">push(item)</text>

    <!-- Pop Arrow -->
    <path d="M 455 270 L 405 270" stroke="#059669" stroke-width="3" stroke-dasharray="4,4"/>
    <polygon points="405,265 395,270 405,275" fill="#059669" />
    <text x="425" y="292" font-family="Consolas, monospace" font-size="10" font-weight="bold" fill="#059669" text-anchor="middle">pop(result)</text>
  </g>

  <!-- Screen 2: Detail Screen (Right Box) -->
  <g filter="url(#exp4aShadow)">
    <rect x="470" y="125" width="330" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="470" y="125" width="330" height="38" rx="12" fill="#0f766e"/>
    <text x="490" y="150" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Screen B: Detail Screen</text>

    <text x="495" y="190" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Received Item Parameters:</text>
    <line x1="495" y1="200" x2="775" y2="200" stroke="#f1f5f9" stroke-width="1.5"/>

    <text x="495" y="225" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b">Item ID:</text>
    <text x="775" y="225" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="end">ITEM-9042</text>

    <text x="495" y="250" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b">Item Name:</text>
    <text x="775" y="250" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="end">Flutter Web Cloud Engine</text>

    <text x="495" y="275" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b">Price:</text>
    <text x="775" y="275" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#0f766e" text-anchor="end">$49.99</text>

    <!-- Action Buttons -->
    <rect x="495" y="320" width="125" height="36" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="557" y="342" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#64748b" text-anchor="middle">Cancel</text>

    <rect x="635" y="320" width="140" height="36" rx="6" fill="#0f766e"/>
    <text x="705" y="342" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Confirm &amp; Pop ↵</text>

    <text x="635" y="390" font-family="Consolas, monospace" font-size="10" fill="#64748b" text-anchor="middle">Navigator.pop(context, 'Confirmed...')</text>
  </g>
</svg>
