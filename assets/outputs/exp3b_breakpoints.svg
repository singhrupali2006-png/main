<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="100%">
  <defs>
    <linearGradient id="exp3bHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#155e75" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <filter id="exp3bShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Browser Frame -->
  <rect x="20" y="15" width="810" height="490" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  
  <!-- Browser Chrome Header -->
  <path d="M 20 25 Q 20 15 30 15 L 820 15 Q 830 15 830 25 L 830 52 L 20 52 Z" fill="#e2e8f0" />
  <circle cx="44" cy="34" r="6" fill="#ef4444" />
  <circle cx="64" cy="34" r="6" fill="#f59e0b" />
  <circle cx="84" cy="34" r="6" fill="#10b981" />
  
  <!-- URL Bar -->
  <rect x="180" y="24" width="480" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="420" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569" text-anchor="middle">
    🔒 http://localhost:8080/#/exp3b-media-queries
  </text>

  <!-- Flutter App Bar -->
  <rect x="20" y="52" width="810" height="46" fill="url(#exp3bHeaderGrad)" />
  <text x="50" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#ffffff">
    Exp 3(b): MediaQuery &amp; Adaptive Breakpoints (NavigationRail vs BottomBar)
  </text>

  <!-- Desktop NavigationRail on Left -->
  <rect x="20" y="98" width="90" height="407" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="65" cy="135" r="20" fill="#0e7490" />
  <text x="65" y="141" font-size="14" fill="#ffffff" text-anchor="middle">⚡</text>

  <!-- Rail Item 1 (Selected) -->
  <rect x="28" y="180" width="74" height="48" rx="8" fill="#cffafe" />
  <circle cx="65" cy="196" r="6" fill="#0891b2" />
  <text x="65" y="218" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold" fill="#0891b2" text-anchor="middle">Dashboard</text>

  <!-- Rail Item 2 -->
  <circle cx="65" cy="245" r="6" fill="#94a3b8" />
  <text x="65" y="267" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Analytics</text>

  <!-- Rail Item 3 -->
  <circle cx="65" cy="295" r="6" fill="#94a3b8" />
  <text x="65" y="317" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Settings</text>

  <!-- Main View Area -->
  <!-- Breakpoint Active Indicator Card -->
  <g filter="url(#exp3bShadow)">
    <rect x="135" y="120" width="670" height="70" rx="12" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.5"/>
    <circle cx="165" cy="155" r="16" fill="#0891b2" />
    <text x="165" y="160" font-size="14" fill="#ffffff" text-anchor="middle">🖥️</text>
    <text x="195" y="148" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="bold" fill="#164e63">
      Active Breakpoint: Desktop (Width &gt;= 1024px)
    </text>
    <text x="195" y="168" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#0e7490">
      Navigation strategy: Persistent Left NavigationRail activated. Canvas width allows multi-pane layout.
    </text>
  </g>

  <!-- Live MediaQuery Telemetry Inspector Card -->
  <g filter="url(#exp3bShadow)">
    <rect x="135" y="210" width="670" height="260" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="160" y="240" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="bold" fill="#0f172a">
      Live MediaQuery Telemetry Data Readout
    </text>
    <line x1="160" y1="252" x2="780" y2="252" stroke="#f1f5f9" stroke-width="1.5"/>

    <!-- Data Rows -->
    <g font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">
      <text x="160" y="280" fill="#64748b">Window Width</text>
      <text x="760" y="280" font-family="Consolas, monospace" font-weight="bold" fill="#0891b2" text-anchor="end">1280.0 dp</text>

      <text x="160" y="312" fill="#64748b">Window Height</text>
      <text x="760" y="312" font-family="Consolas, monospace" font-weight="bold" fill="#0891b2" text-anchor="end">720.0 dp</text>

      <text x="160" y="344" fill="#64748b">Device Orientation</text>
      <text x="760" y="344" font-family="Consolas, monospace" font-weight="bold" fill="#16a34a" text-anchor="end">LANDSCAPE</text>

      <text x="160" y="376" fill="#64748b">Device Pixel Ratio</text>
      <text x="760" y="376" font-family="Consolas, monospace" font-weight="bold" fill="#7c3aed" text-anchor="end">2.0x (Retina / HiDPI)</text>

      <text x="160" y="408" fill="#64748b">Safe Area Top Padding</text>
      <text x="760" y="408" font-family="Consolas, monospace" font-weight="bold" fill="#334155" text-anchor="end">0.0 dp (Web Canvas)</text>

      <text x="160" y="440" fill="#64748b">Platform Brightness</text>
      <text x="760" y="440" font-family="Consolas, monospace" font-weight="bold" fill="#ea580c" text-anchor="end">LIGHT MODE</text>
    </g>
  </g>
</svg>
