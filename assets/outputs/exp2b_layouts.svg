<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="100%">
  <defs>
    <linearGradient id="exp2bHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="exp2bHeroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134e4a" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="exp2bShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Browser Frame -->
  <rect x="20" y="15" width="810" height="490" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  
  <!-- Browser Chrome Header -->
  <path d="M 20 25 Q 20 15 30 15 L 820 15 Q 830 15 830 25 L 830 52 L 20 52 Z" fill="#e2e8f0" />
  <circle cx="44" cy="34" r="6" fill="#ef4444" />
  <circle cx="64" cy="34" r="6" fill="#f59e0b" />
  <circle cx="84" cy="34" r="6" fill="#10b981" />
  
  <!-- URL Bar -->
  <rect x="180" y="24" width="480" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="420" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569" text-anchor="middle">
    🔒 http://localhost:8080/#/exp2b-layouts
  </text>

  <!-- Flutter App Bar -->
  <rect x="20" y="52" width="810" height="48" fill="url(#exp2bHeaderGrad)" />
  <text x="50" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    Exp 2(b): Layouts (Row, Column, Stack &amp; Positioned)
  </text>

  <!-- Section 1: Row Layout -->
  <text x="70" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold" fill="#0f766e">
    1. Row Layout (Horizontal Flex &amp; Proportions)
  </text>
  <g filter="url(#exp2bShadow)">
    <rect x="70" y="142" width="710" height="100" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="90" y="168" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#475569">
      MainAxisAlignment.spaceBetween with fixed &amp; flex-proportional Expanded containers:
    </text>
    
    <!-- Fixed Width Container -->
    <rect x="90" y="182" width="120" height="44" rx="8" fill="#0d9488" />
    <text x="150" y="209" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Fixed: 120px</text>

    <!-- Expanded Flex 2 -->
    <rect x="220" y="182" width="350" height="44" rx="8" fill="#14b8a6" />
    <text x="395" y="209" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Expanded (Flex: 2)</text>

    <!-- Expanded Flex 1 -->
    <rect x="580" y="182" width="180" height="44" rx="8" fill="#5eead4" />
    <text x="670" y="209" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#134e4a" text-anchor="middle">Expanded (Flex: 1)</text>
  </g>

  <!-- Section 2: Stack Layout -->
  <text x="70" y="275" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold" fill="#0f766e">
    2. Stack Layout (Layered Z-Index Positioning)
  </text>
  <g filter="url(#exp2bShadow)">
    <!-- Base Layer Canvas -->
    <rect x="70" y="288" width="710" height="190" rx="16" fill="url(#exp2bHeroGrad)" />
    
    <!-- Background Motif / Dash Icon -->
    <circle cx="425" cy="370" r="45" fill="#ffffff" fill-opacity="0.15" />
    <polygon points="405,370 425,340 445,370 435,395 415,395" fill="#ffffff" fill-opacity="0.25" />

    <!-- Positioned Tag Top-Right -->
    <rect x="650" y="304" width="110" height="28" rx="14" fill="#fbbf24" filter="url(#exp2bShadow)"/>
    <text x="705" y="322" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#78350f" text-anchor="middle">★ FEATURED</text>

    <!-- Positioned Bottom Banner Overlay -->
    <rect x="70" y="420" width="710" height="58" rx="0" fill="#090d16" fill-opacity="0.65" />
    
    <text x="95" y="445" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">
      Layered Hero Card Component
    </text>
    <text x="95" y="465" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#99f6e4">
      Built using Stack, Positioned, and Align widgets with responsive flex layout
    </text>

    <!-- Positioned Action Button -->
    <rect x="670" y="432" width="90" height="32" rx="8" fill="#ffffff" />
    <text x="715" y="452" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#0f766e" text-anchor="middle">🔖 Bookmark</text>
  </g>
</svg>
